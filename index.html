<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18岁的蓝在sunny时刻——26/27烟幕二群联赛</title>
  <!-- 样式分层：theme（设计令牌）→ base（重置/基础）→ layout（布局）→ components（组件） -->
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="print-frame" aria-hidden="true">
    <span class="corner-mark corner-mark-tl"></span>
    <span class="corner-mark corner-mark-tr"></span>
    <span class="corner-mark corner-mark-bl"></span>
    <span class="corner-mark corner-mark-br"></span>
  </div>
  <div class="page-watermark" aria-hidden="true">烟幕</div>
  <div class="side-title side-title-left" aria-hidden="true">煙幕二群聯賽</div>
  <div class="side-title side-title-right" aria-hidden="true">🔅18岁的蓝在sunny时刻 ·</div>
  <div class="diamond-field" aria-hidden="true">
    <span class="diamond diamond-a">◆</span>
    <span class="diamond diamond-b">◆</span>
    <span class="diamond diamond-c">◆</span>
    <span class="diamond diamond-d">◆</span>
    <span class="diamond diamond-e">◆</span>
    <span class="diamond diamond-f">◆</span>
  </div>

  <!-- ==================== 顶部 Header：联赛信息 + 当前 GW 倒计时 ==================== -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1 class="brand-name" id="leagueName">加载中…</h1>
        <span class="brand-season" id="leagueSeason"></span>
      </div>

      <!-- 当前轮次 / 状态 / 倒计时（src/components/Header.js 渲染） -->
      <div class="gw-banner" aria-live="polite">
        <div class="gw-badge">
          <span class="gw-badge-num" id="gwNumber">GW-</span>
          <span class="gw-badge-status" id="gwStatus" data-key="">—</span>
        </div>
        <div class="gw-timer-block">
          <div class="gw-deadline-line" id="gwDeadlineLine">—</div>
          <div class="gw-countdown" id="gwCountdown">--</div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== 主内容区：桌面双栏 / 移动端单列 ==================== -->
  <main class="container layout">

    <!-- ---- 主栏：Classic Weekly Winner 手风琴 + 联赛规则 ---- -->
    <div class="column column-main">
      <section class="card" aria-labelledby="classicTitle">
        <div class="card-header">
          <h2 class="card-title" id="classicTitle">Classic Weekly Winner</h2>
          <span class="card-hint">每轮周最佳 · 点击展开阵容与颁奖图</span>
        </div>
        <!-- 38 行手风琴列表（src/components/ClassicWinnerList.js 渲染） -->
        <div class="cw-list" id="classicWinnerList">
          <div class="loading">加载中…</div>
        </div>
      </section>

      <!-- 联赛规则（src/components/LeagueRules.js 渲染） -->
      <div id="leagueRulesView">
        <div class="loading">加载中…</div>
      </div>
    </div>

    <!-- ---- 侧栏：Picks 3 + 竞猜排行榜 ---- -->
    <div class="column column-side">
      <!-- Picks 3 Weekly Winner（src/components/Picks3Module.js 渲染） -->
      <div id="picks3View">
        <div class="loading">加载中…</div>
      </div>

      <!-- 竞猜排行榜（src/components/PredictionLeaderboard.js 渲染） -->
      <section class="card" aria-labelledby="lbTitle">
        <div class="card-header">
          <h2 class="card-title" id="lbTitle">竞猜排行榜</h2>
          <div class="prize-pool">
            <span class="prize-pool-label">累计奖池</span>
            <span class="prize-pool-amount" id="prizePoolAmount">¥0</span>
          </div>
        </div>
        <div id="leaderboardView">
          <div class="loading">加载中…</div>
        </div>
      </section>

      <!-- FPL Classic 联赛分数排名（src/components/LeagueStandings.js 渲染） -->
      <div id="leagueStandingsView">
        <div class="loading">联赛排名加载中…</div>
      </div>
    </div>
  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="site-footer">
    <div class="container">
      <p id="footerNote">数据来源：config.json + data/cachedSquads.json（由 scripts/build-fpl-cache.js 生成）</p>
    </div>
  </footer>

  <!-- 入口：Vite 构建（dev 直接跑，build 产物相对路径，兼容 GitHub Pages 子路径） -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
