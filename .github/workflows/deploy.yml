name: deploy

# GitHub Pages 自动部署：push 到 main，或 FPL 缓存更新完成后构建 dist/ 并发布。
# 需在仓库 Settings → Pages → Source 选择 “GitHub Actions”。

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [update-fpl-cache]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # 缓存任务失败时保留上一版站点；成功时确保部署包含它刚生成的缓存。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 构建静态站点
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
